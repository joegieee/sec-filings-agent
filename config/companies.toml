# Company universe for ingestion. CIKs are checked at ingest time against the
# tickers EDGAR returns for that CIK, so a typo fails loudly instead of
# silently ingesting the wrong company.

[sets]
# Starter set: two large banks plus a fintech, so bank-only metrics
# (NIM, CET1) are present for some filers and must come back null for others.
core3 = ["JPM", "BAC", "PYPL"]
banks = ["JPM", "BAC", "C", "WFC", "GS", "MS", "USB", "PNC", "TFC", "COF", "BK", "STT", "SCHW"]
fintech = ["PYPL", "XYZ", "V", "MA", "AXP", "SOFI", "FI"]

[[companies]]
ticker = "JPM"
cik = 19617
name = "JPMorgan Chase & Co."
sector = "bank"

