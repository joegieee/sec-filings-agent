# Analyst questions for the Q&A eval over JPM, BAC and PYPL.
#
# Numeric reference answers are not typed in: they are computed at eval time from
# EDGAR's XBRL company facts (value, change, ratio, compare). `text` questions are
# hand-labelled from the filings: the answer must contain every keyword group (any
# one keyword per group) and cite a passage from that company. `unanswerable`
# questions must be abstained on.
#
# Kinds and fields:
#   value         ticker, metric, period
#   change        ticker, metric, period (from), period_to   -> percent change
#   ratio         ticker, metric (numerator), denominator, period -> percent
#   compare       tickers, metric, period, pick = highest | lowest -> winner and its value
#   text          ticker, keywords = [[any of...], ...]
#   unanswerable  reason

# --- single figures -----------------------------------------------------------------

[[questions]]
id = "jpm-net-income-fy2024"
question = "What was JPMorgan Chase's net income for fiscal year 2024?"
kind = "value"
ticker = "JPM"
metric = "net_income"
period = "FY2024"

[[questions]]
id = "bac-total-assets-q2-2026"
question = "What were Bank of America's total assets at the end of the second quarter of 2026?"
kind = "value"
ticker = "BAC"
metric = "total_assets"
period = "Q2 2026"

[[questions]]
id = "pypl-eps-fy2025"
question = "What was PayPal's diluted earnings per share for 2025?"
kind = "value"
ticker = "PYPL"
metric = "diluted_eps"
period = "FY2025"

[[questions]]
id = "bac-nii-q3-2025"
question = "How much net interest income did Bank of America earn in the third quarter of 2025?"
kind = "value"
ticker = "BAC"
metric = "net_interest_income"
period = "Q3 2025"

[[questions]]
id = "pypl-ocf-9m-2025"
question = "What was PayPal's operating cash flow for the first nine months of 2025?"
kind = "value"
ticker = "PYPL"
metric = "operating_cash_flow"
