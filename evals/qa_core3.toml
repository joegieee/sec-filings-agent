# --- comparisons ------------------------------------------------------------------------

[[questions]]
id = "highest-net-income-fy2025"
question = "Which of JPMorgan, Bank of America and PayPal had the highest net income in 2025, and how much was it?"
kind = "compare"
tickers = ["JPM", "BAC", "PYPL"]
metric = "net_income"
period = "FY2025"
pick = "highest"

[[questions]]
id = "lowest-eps-fy2024"
question = "Among JPMorgan, Bank of America and PayPal, which reported the lowest diluted EPS for 2024, and what was it?"
kind = "compare"
tickers = ["JPM", "BAC", "PYPL"]
