[project]
name = "sec-filings-agent"
version = "0.1.0"
description = "A tool-using LLM research agent over SEC filings, with cited answers and measured evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "openai>=3.37.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
filings-agent = "filings_agent.cli:app"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
